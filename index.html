<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>3D Configurator - Asymmetric Shelving</title>
    <style>
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 260px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 1000;
            }

            #ui h3 {
            margin: 14px 0 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            }

            #ui button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            padding: 8px 10px;
            border-radius: 10px;
            border: none;
            background: #f5f5f5;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            }

            #ui button:hover {
            background: #e8e8e8;
            transform: translateY(-1px);
            }

            #ui button.active {
            background: #111;
            color: white;
            }

    </style>
</head>
<body>
    <div id="ui">
        <div class="control">
            <label for="heightInput">Altura (cm)</label>
            <input 
                id="heightInput"
                type="number"
                min="30"
                step="10"
                value="30"
            />
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
